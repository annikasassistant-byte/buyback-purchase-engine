[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# =============================================================================
# Project metadata (PEP 621)
# =============================================================================
[project]
name = "buyback-purchase-engine"
description = "BuyBack Purchase Engine - Phase 2 MVP: features, Purchase Score, Confidence Score, quantity + budget allocation, explanation generator."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "BuyBack" }]
keywords = ["recommendation", "inventory", "re-commerce", "scoring", "decision-support"]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Other Audience",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dynamic = ["version"]
dependencies = [
    "pandas>=2.1",
    "openpyxl>=3.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.1",
    "types-PyYAML>=6.0",
    "pre-commit>=3.7",
]

[project.scripts]
purchase-engine = "purchase_engine.cli:main"

[project.urls]
Repository = "https://github.com/annikasassistant-byte/buyback-purchase-engine"

# =============================================================================
# Build: src/ layout, version single-sourced from the package
# =============================================================================
[tool.hatch.version]
path = "src/purchase_engine/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/purchase_engine"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "docs/", "README.md", "CHANGELOG.md", "LICENSE"]

# =============================================================================
# Ruff - lint + format (replaces black, isort, flake8 + plugins)
# =============================================================================
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # isort
    "N",           # pep8-naming
    "UP",          # pyupgrade
    "B",           # flake8-bugbear
    "C4",          # flake8-comprehensions
    "SIM",         # flake8-simplify
    "PTH",         # flake8-use-pathlib
    "RET",         # flake8-return
    "TID",         # flake8-tidy-imports
    "PL",          # pylint
    "TRY",         # tryceratops
    "PERF",        # perflint
    "RUF",         # ruff-specific
]
ignore = [
    "PLR0911",   # many returns - lookup ladders read better as early returns
    "PLR0913",   # many arguments - domain functions legitimately take many features
    "PLR2004",   # magic value - scoring thresholds are self-documenting here
    "PLR0912",   # many branches - feature/score builders are inherently branchy
    "PLR0915",   # many statements - same
    "TRY003",    # long messages outside exception class - fine for a small codebase
    "SIM108",    # ternary - not always more readable
]
# NBSP / en-dash / em-dash appear on purpose in _normalize.py (they get replaced).
allowed-confusables = [" ", "–", "—"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ARG001", "N802"]
"src/purchase_engine/_normalize.py" = ["N806"]  # German column names in local vars

[tool.ruff.lint.isort]
known-first-party = ["purchase_engine", "tests"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

# =============================================================================
# mypy - static typing
# =============================================================================
[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
extra_checks = true

[[tool.mypy.overrides]]
module = ["pandas.*", "yaml.*", "openpyxl.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

# =============================================================================
# pytest + coverage
# =============================================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-q",
    "--strict-markers",
    "--strict-config",
    "--cov=purchase_engine",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=85",
]
markers = [
    "golden: full-pipeline run against the checked-in workbook (slower)",
]

[tool.coverage.run]
source = ["purchase_engine"]
branch = true

[tool.coverage.report]
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
