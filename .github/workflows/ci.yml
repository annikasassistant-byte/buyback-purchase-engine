name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check --output-format=github src tests

      - name: Ruff (format check)
        run: ruff format --check src tests

      - name: mypy
        run: mypy

      - name: Security (bandit + pip-audit)
        # Once per matrix run is enough - neither tool's result depends on
        # the Python version, and CI's job is clean by construction (only
        # `.[dev]` is installed here), unlike a shared local dev venv -
        # see ADR 0011 for why that distinction matters.
        if: matrix.python-version == '3.12'
        run: |
          bandit -r src/purchase_engine
          pip-audit

      - name: Tests
        # `tests/golden` pins exact scores against the checked-in workbook and
        # is deliberately slow - kept out of the fast path (ADR 0007), not
        # because the data isn't here. `tests/api` and the Postgres-backed
        # unit tests need DATABASE_URL - set as repo secrets (a Neon
        # database dedicated to CI); they skip cleanly if it's ever absent.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_POOLED: ${{ secrets.DATABASE_URL_POOLED }}
        run: pytest -m "not golden" --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
